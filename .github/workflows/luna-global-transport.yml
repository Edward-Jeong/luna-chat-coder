name: Luna global workspace exact transport
on:
  push:
    branches:
      - feat/global-luna-workspace-router-20261114
    paths:
      - '.github/workflows/luna-global-transport.yml'
permissions:
  contents: write
jobs:
  materialize-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - name: Check source identity and exact compressed payload
        shell: python
        run: |
          import base64, hashlib, io, pathlib, subprocess, tarfile
          assert subprocess.call(["git","merge-base","--is-ancestor","08ba7939698f0d4d614fcfcef1559c5708be39d4","HEAD"]) == 0, "unexpected base"
          encoded = "".join(pathlib.Path(f".luna-global-payload.part{i}").read_text() for i in range(5))
          assert len(encoded) == 16156, f"transport size mismatch: {len(encoded)}"
          packed = base64.b64decode(encoded, validate=True)
          digest = hashlib.sha256(packed).hexdigest()
          assert digest == "48abd4738c398a7469be033d5224935f99a74a7046d1d4169663874a62e85c6d", digest
          expected = {
              "scripts/luna_workspace.py", "scripts/install_luna_global.py",
              "docs/GLOBAL_CODEX_ROUTER.ko.md",
              "tests/test_luna_workspace.py", "tests/test_install_luna_global.py",
          }
          with tarfile.open(fileobj=io.BytesIO(packed), mode="r:gz") as archive:
              members = archive.getmembers()
              assert {m.name for m in members} == expected
              for member in members:
                  assert member.isfile() and member.name in expected
                  path = pathlib.Path(member.name)
                  assert not path.exists(), f"would overwrite {path}"
                  path.parent.mkdir(parents=True, exist_ok=True)
                  path.write_bytes(archive.extractfile(member).read())
          print("LUNA_GLOBAL_TRANSPORT_SHA256_OK", digest)
      - name: Repository regression tests
        run: python -m unittest discover -s tests -v
      - name: Syntax and staged diff
        run: |
          python -m py_compile scripts/luna_workspace.py scripts/install_luna_global.py
          git add scripts/luna_workspace.py scripts/install_luna_global.py docs/GLOBAL_CODEX_ROUTER.ko.md tests/test_luna_workspace.py tests/test_install_luna_global.py
          git diff --cached --check
      - name: Publish only verified source files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat: add opt-in global Luna CLI with project-isolated sessions"
          git push origin HEAD:feat/global-luna-workspace-router-20261114
