name: Luna model-routing validation

on:
  pull_request:
    paths:
      - 'scripts/luna_model_router.py'
      - 'tests/test_luna_model_router.py'
      - 'docs/MODEL_ROUTING.ko.md'
      - '.github/workflows/luna-model-routing.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.11'
      - run: python -m py_compile scripts/luna_model_router.py
      - run: python -m unittest discover -s tests -p 'test_luna_model_router.py' -v
